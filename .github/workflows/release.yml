name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  zip:
    name: Attach integration zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Build zip
        working-directory: custom_components/malaysia_weather
        run: zip -r "$GITHUB_WORKSPACE/malaysia_weather.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" malaysia_weather.zip --clobber --repo "$GITHUB_REPOSITORY"
          fi
